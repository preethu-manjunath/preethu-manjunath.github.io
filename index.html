<style>
:root{
  --ink:#f4f1ea; --ink-2:rgba(244,241,234,.78); --ink-3:rgba(244,241,234,.55);
  --serif:"Source Serif 4",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1712;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
:focus-visible{outline:2px solid #fff;outline-offset:3px;border-radius:3px}

/* soft shade so white text stays readable over bright sky */
.shade{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:linear-gradient(180deg,rgba(0,0,0,.28),rgba(0,0,0,0) 18%,rgba(0,0,0,0) 55%,rgba(0,0,0,.5))}

.top{position:fixed;top:0;left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:18px 22px;font-size:15px;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.top .name{font-weight:600;text-decoration:none}
.top a.link{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.5);padding-bottom:1px}

.caption{position:fixed;left:22px;bottom:26px;z-index:5;max-width:min(520px,calc(100vw - 44px));text-shadow:0 1px 14px rgba(0,0,0,.45);
  transition:opacity .6s ease,transform .6s ease}
.caption.out{opacity:0;transform:translateY(8px)}
.caption .kick{font-size:13.5px;color:var(--ink-2);margin-bottom:8px}
.caption h1,.caption h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,4.6vw,54px);line-height:1.05;letter-spacing:-.015em;margin:0 0 10px}
.caption p{margin:0;font-size:16px;line-height:1.5;color:var(--ink-2)}
.figs{display:flex;gap:28px;margin-top:16px}
.figs div b{display:block;font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.1}
.figs div span{font-size:13px;color:var(--ink-3)}
.links{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:15px}

.ctrl{position:fixed;right:18px;bottom:22px;z-index:5;display:flex;align-items:center;gap:4px;font-size:14px;font-variant-numeric:tabular-nums;
  background:rgba(20,18,14,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:4px}

}

<script type="module">
import * as THREE from "three";
import { RGBELoader } from "three/addons/loaders/RGBELoader.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const mobile = matchMedia("(max-width: 760px), (hover: none)").matches;
const PH = "https://dl.polyhaven.org/file/ph-assets";

/* ═════════════════════ SCENES — kept deliberately short ═════════════════════ */
const SCENES = [
  { kick:"Applied AI engineer · Seattle", title:"Knowledge graphs for energy.", text:"Scroll, swipe or use the arrows to look around.", h1:true },
  { kick:"Oil & gas · Data Squared, 2024 – now", title:"One graph for the whole field.", text:"Operations, maintenance, assets and finance, connected.",
    figs:[["6 mo → 4 wk","to integrate a new system"],["10×","faster invoice review"]] },
  { kick:"Edge AI", title:"Answers at the wellsite.", text:"Small data centers in the field catch risks on site." },
  { kick:"Power", title:"AI runs on this.", text:"Data centers need energy. Energy needs better data." },
  { kick:"Data centers · KOBEYO, 2023 – 24", title:"What runs inside.", text:"RAG, agents and fine-tuned LLMs for a job-matching platform.",
    figs:[["90%+","of sourcing automated"],["50%","faster queries"]] },
  { kick:"Wind", title:"Where I started.", text:"Electrical engineering, then data science." },
  { kick:"Everything connects", title:"Let's talk.", text:"Open to applied AI and solutions-architecture roles.", contact:true },
];

/* ═════════════════════ RENDERER ═════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias:false, powerPreference:"high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.25 : 1.6));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
renderer.domElement.tabIndex = 0;
renderer.domElement.setAttribute("aria-label", "A 3D landscape: an oil field, power lines, a data center and a wind farm. Use the scene controls to move between them.");

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(mobile ? 50 : 36, innerWidth/innerHeight, 0.3, 6000);
camera.position.set(0, 60, 160);

const rt = new THREE.WebGLRenderTarget(1, 1, { type:THREE.HalfFloatType, samples: mobile ? 2 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.18, 0.6, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());
composer.setSize(innerWidth, innerHeight);

/* ═════════════════════ LOADING ═════════════════════ */
const manager = new THREE.LoadingManager();
const loadBar = document.getElementById("loadBar"), loadTxt = document.getElementById("loadTxt");
manager.onProgress = (_, done, total) => { loadBar.style.width = (done/total*100).toFixed(0) + "%"; };
manager.onError = url => console.warn("failed to load", url);
const texLoader = new THREE.TextureLoader(manager);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

function pbr(id, { repeat=[1,1], color="#ffffff", rough=1, metal=null, normalScale=1 } = {}){
  const base = `${PH}/Textures/jpg/1k/${id}/${id}_`;
  const t = k => { const x = texLoader.load(base + k + "_1k.jpg"); x.wrapS = x.wrapT = THREE.RepeatWrapping; x.repeat.set(...repeat); x.anisotropy = maxAniso; return x; };
  const map = t("diff"); map.colorSpace = THREE.SRGBColorSpace;
  const arm = t("arm");
  const m = new THREE.MeshStandardMaterial({ map, normalMap:t("nor_gl"), aoMap:arm, roughnessMap:arm, color, roughness:rough });
  m.normalScale.set(normalScale, normalScale);
  if (metal !== null){ m.metalnessMap = arm; m.metalness = metal; }
  return m;
}
/* Poly Haven glTFs reference textures by relative path; the API tells us where they really live. */
async function polyModel(id){
  const files = await (await fetch(`https://api.polyhaven.com/files/${id}`)).json();
  const g = files.gltf["1k"].gltf, inc = g.include;
  const m = new THREE.LoadingManager();
  m.setURLModifier(url => { for (const k in inc) if (url.endsWith("/" + k) || url.endsWith(k)) return inc[k].url; return url; });
  manager.itemStart(id);
  try { const gltf = await new GLTFLoader(m).loadAsync(g.url); return gltf.scene; }
  finally { manager.itemEnd(id); }
}

/* ═════════════════════ TERRAIN ═════════════════════ */
function hash(x, y){ const s = Math.sin(x*127.1 + y*311.7) * 43758.5453; return s - Math.floor(s); }
function noise(x, y){
  const ix = Math.floor(x), iy = Math.floor(y), fx = x-ix, fy = y-iy;
  const u = fx*fx*(3-2*fx), v = fy*fy*(3-2*fy);
  const a = hash(ix,iy), b = hash(ix+1,iy), c = hash(ix,iy+1), d = hash(ix+1,iy+1);
  return a + (b-a)*u + (c-a)*v + (a-b-c+d)*u*v;
}
function fbm(x, y){ let s=0, a=1, f=1; for (let i=0;i<5;i++){ s += a*noise(x*f, y*f); a*=.5; f*=2.03; } return s/1.94; }
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x-a)/(b-a))); return t*t*(3-2*t); };
function heightAt(x, z){
  const d = Math.hypot(x+60, z+60);
  const near = (fbm(x*.012, z*.012) - .5) * 1.6;                    // gentle roll in the working area
  const far  = fbm(x*.0022+7, z*.0022+3) * 140 * smooth(420, 1400, d);   // hills toward the horizon
  const ridge = Math.max(0, fbm(x*.004+11, z*.004) - .35) * 70 * smooth(160, 420, Math.hypot(x-360, z+240));
  return near + far + ridge*0 + windRidge(x, z);
}
function windRidge(x, z){ // a low ridge for the turbines
  const dx = (x - 380)/260, dz = (z + 280)/120;
  return Math.max(0, 1 - dx*dx - dz*dz) * 26;
}

const groundMat = pbr("grass_path_2", { repeat:[1,1], normalScale:1.2 });
// Break up tiling: sample the ground texture at two scales and add a slow colour drift.
groundMat.onBeforeCompile = sh => {
  sh.vertexShader = sh.vertexShader.replace("#include <common>", "#include <common>\nvarying vec3 vWPos;")
    .replace("#include <worldpos_vertex>", "#include <worldpos_vertex>\nvWPos = (modelMatrix * vec4(transformed,1.0)).xyz;");
  sh.fragmentShader = sh.fragmentShader.replace("#include <common>", `#include <common>
varying vec3 vWPos;
float h2(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
float n2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h2(i),h2(i+vec2(1,0)),u.x), mix(h2(i+vec2(0,1)),h2(i+vec2(1,1)),u.x), u.y); }`)
    .replace("#include <map_fragment>", `
  vec2 wuv = vWPos.xz / 7.0;
  vec4 c1 = texture2D(map, wuv);
  vec4 c2 = texture2D(map, wuv * 0.173 + 0.31);
  float m = n2(vWPos.xz * 0.012);
  vec4 texelColor = mix(c1, c2, 0.45);
  texelColor.rgb *= mix(vec3(0.86,0.8,0.68), vec3(1.08,1.04,0.94), m);
  diffuseColor *= texelColor;`)
    .replace("#include <normal_fragment_maps>", `
  vec3 mapN = texture2D(normalMap, vWPos.xz / 7.0).xyz * 2.0 - 1.0;
  mapN.xy *= normalScale;
  normal = normalize(tbn * mapN);`)
    .replace("#include <roughnessmap_fragment>", "float roughnessFactor = roughness * mix(0.85, 1.0, texture2D(roughnessMap, vWPos.xz/7.0).g);");
};
{
  const size = 5200, seg = mobile ? 220 : 320;
  const g = new THREE.PlaneGeometry(size, size, seg, seg); g.rotateX(-Math.PI/2);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++) p.setY(i, heightAt(p.getX(i), p.getZ(i)));
  g.computeVertexNormals();
  const ground = new THREE.Mesh(g, groundMat);
  ground.receiveShadow = true;
  scene.add(ground);
}

/* flat textured strips/pads that sit on the ground */
function pad(mat, x, z, w, d, rot=0){
  const g = new THREE.PlaneGeometry(w, d, Math.ceil(w/4), Math.ceil(d/4)); g.rotateX(-Math.PI/2); g.rotateY(rot);
  const p = g.attributes.position;
  for (let i=0;i<p.count;i++) p.setY(i, heightAt(x+p.getX(i), z+p.getZ(i)) + .05);
  const m = new THREE.Mesh(g, mat); m.position.set(x, 0, z); m.receiveShadow = true; scene.add(m);
  return m;
}
const gravel = pbr("dry_ground_rocks", { repeat:[4,4], color:"#cfc2aa" });
gravel.polygonOffset = true; gravel.polygonOffsetFactor = -2;
function road(ax, az, bx, bz, w=5){
  const len = Math.hypot(bx-ax, bz-az), ang = Math.atan2(bx-ax, bz-az);
  const m = pbr("dry_ground_rocks", { repeat:[1, len/5], color:"#cfc2aa" }); m.polygonOffset = true; m.polygonOffsetFactor = -2;
  pad(m, (ax+bx)/2, (az+bz)/2, w, len, ang);
}

/* ═════════════════════ MATERIALS ═════════════════════ */
const paint = pbr("green_metal_rust", { repeat:[1,2], color:"#8f9489", metal:.7 });
const paintBeam = pbr("green_metal_rust", { repeat:[4,1], color:"#8f9489", metal:.7 });
const rust = pbr("rusty_metal_02", { repeat:[1,1], metal:1 });
const steel = new THREE.MeshStandardMaterial({ color:"#9aa0a3", roughness:.45, metalness:.9 });
const darkSteel = new THREE.MeshStandardMaterial({ color:"#3a3d40", roughness:.6, metalness:.8 });
const concrete = pbr("concrete_floor_02", { repeat:[2,2] });
const tankMat = pbr("corrugated_iron_02", { repeat:[6,1.5], color:"#e8dcc4", metal:.6 });
const wallMat = pbr("corrugated_iron_02", { repeat:[40,2], color:"#dfe2e3", metal:.5 });
const wallMatShort = pbr("corrugated_iron_02", { repeat:[18,2], color:"#dfe2e3", metal:.5 });
const roofMat = pbr("concrete_floor_02", { repeat:[12,6], color:"#b8b8b4" });
const white = new THREE.MeshStandardMaterial({ color:"#eeeeea", roughness:.42, metalness:.05 });
const galv = new THREE.MeshStandardMaterial({ color:"#a7abad", roughness:.55, metalness:.75 });
const cableMat = new THREE.MeshStandardMaterial({ color:"#2a2b2c", roughness:.5, metalness:.6 });
const insulatorMat = new THREE.MeshStandardMaterial({ color:"#5b6a5a", roughness:.3, metalness:.1 });

const shadowed = o => { o.traverse(c => { if (c.isMesh){ c.castShadow = true; c.receiveShadow = true; } }); return o; };
const M = (geo, mat, x=0, y=0, z=0, parent) => { const m = new THREE.Mesh(geo, mat); m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; (parent||scene).add(m); return m; };
const box = (w,h,d,mat,x,y,z,p) => M(new THREE.BoxGeometry(w,h,d), mat, x, y, z, p);
const cyl = (rt,rb,h,mat,x,y,z,p,seg=20) => M(new THREE.CylinderGeometry(rt,rb,h,seg), mat, x, y, z, p);
function strut(a, b, r, mat, parent){ // a cylinder between two points
  const d = new THREE.Vector3().subVectors(b, a), len = d.length();
  const m = M(new THREE.CylinderGeometry(r, r, len, 8), mat, 0,0,0, parent);
  m.position.copy(a).addScaledVector(d, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0), d.normalize());
  return m;
}
const animators = [];

/* ═════════════════════ PUMPJACK — real crank/pitman/beam geometry ═════════════════════ */
function pumpjack(x, z, ry, phase, spm=7){
  const g = new THREE.Group(); g.position.set(x, heightAt(x,z), z); g.rotation.y = ry; scene.add(g);
  const B = new THREE.Vector3(0, 6.4, 0);          // saddle bearing
  const L = 4.2, H = 5.8, C = new THREE.Vector3(-4.4, 2.35, 0), r = 1.25;
  const P = Math.hypot(-L - C.x, B.y - C.y);       // pitman length at level beam

  box(13.5, .7, 3.4, concrete, .8, .15, 0, g);                 // foundation
  [-1.1, 1.1].forEach(s => box(12.5, .45, .35, paint, .6, .7, s, g)); // base skids
  for (let i=0;i<4;i++) box(.3, .3, 2.5, paint, -4.6 + i*3.4, .7, 0, g);
  // samson post (A-frame)
  [-1, 1].forEach(s => {
    strut(new THREE.Vector3(-1.4, .9, s*1.1), new THREE.Vector3(0, B.y-.2, s*.35), .16, paint, g);
    strut(new THREE.Vector3( 1.6, .9, s*1.1), new THREE.Vector3(0, B.y-.2, s*.35), .16, paint, g);
  });
  box(.6, .5, 1.2, darkSteel, 0, B.y-.1, 0, g);
  // gear reducer, motor, belt guard
  box(1.9, 1.9, 1.3, paint, C.x, 1.5, 0, g);
  cyl(.42, .42, 1.1, darkSteel, C.x-2.3, 1.25, .1, g).rotation.x = Math.PI/2;
  box(2.4, .9, .25, paint, C.x-1.2, 1.4, .72, g);
  // crank arms + counterweights, both sides
  const crank = new THREE.Group(); crank.position.copy(C); g.add(crank);
  const cwShape = new THREE.Shape(); cwShape.absarc(0, 0, 1.55, -0.55, 0.55, false); cwShape.absarc(0, 0, .55, 0.55, -0.55, true);
  const cwGeo = new THREE.ExtrudeGeometry(cwShape, { depth:.32, bevelEnabled:true, bevelSize:.04, bevelThickness:.04, bevelSegments:1 });
  [-1, 1].forEach(s => {
    const arm = box(2.8, .42, .22, paint, -.25, 0, s*.88, crank);
    const cw = M(cwGeo, darkSteel, 0, 0, s*.88 + (s>0 ? .12 : -.44), crank); cw.rotation.z = Math.PI;
  });
  // walking beam + horsehead
  const beam = new THREE.Group(); beam.position.copy(B); g.add(beam);
  box(L + H - .4, .62, .5, paintBeam, (H - L)/2 - .2, .2, 0, beam);
  const hh = new THREE.Shape();
  hh.absarc(0, 0, H + .15, -0.42, 0.2, false);
  hh.lineTo(Math.cos(.2)*(H-1.1), Math.sin(.2)*(H-1.1));
  hh.absarc(0, 0, H - 1.1, 0.2, -0.3, true);
  const hhGeo = new THREE.ExtrudeGeometry(hh, { depth:.8, bevelEnabled:true, bevelSize:.05, bevelThickness:.05, bevelSegments:1 });
  M(hhGeo, paint, 0, 0, -.4, beam);
  box(.9, .9, .9, paint, -L, .15, 0, beam);                       // equalizer
  // pitman arms (updated per frame)
  const pitmen = [-1, 1].map(s => M(new THREE.BoxGeometry(.22, 1, .22), paint, 0, 0, s*.95, g));
  // wellhead, polished rod, bridle, carrier bar
  const wx = H + .15;
  cyl(.28, .28, 1.2, rust, wx, .7, 0, g); cyl(.42, .42, .25, rust, wx, 1.35, 0, g);
  cyl(.18, .18, .8, rust, wx, 1.85, 0, g);
  const tee = cyl(.14, .14, 1.8, rust, wx, 1.1, 0, g); tee.rotation.x = Math.PI/2;
  const rod = M(new THREE.CylinderGeometry(.05, .05, 4.6, 8), steel, wx, 0, 0, g);
  const carrier = box(.9, .18, .3, darkSteel, wx, 0, 0, g);
  const bridles = [-.3, .3].map(s => M(new THREE.CylinderGeometry(.025, .025, 1, 6), darkSteel, wx, 0, s, g));

  const T = new THREE.Vector3(), pin = new THREE.Vector3(), tmp = new THREE.Vector3();
  const tail = phi => T.set(B.x - L*Math.cos(phi), B.y - L*Math.sin(phi), 0);
  function pose(t){

const towerGeo = (() => {

const ATTACH = [[-7.5,22],[7.5,22],[-7.5,28],[7.5,28],[-4.5,33],[4.5,33]];
function transmissionLine(points){
  const towers = points.map(([x, z], i) => {
    const next = points[Math.min(i+1, points.length-1)], prev = points[Math.max(i-1, 0)];
    const ang = Math.atan2(next[0]-prev[0], next[1]-prev[1]);
    const y = heightAt(x, z);
    const t = new THREE.Mesh(towerGeo, galv); t.position.set(x, y, z); t.rotation.y = ang + Math.PI/2;
    t.castShadow = true; t.receiveShadow = true; scene.add(t);
    const tips = ATTACH.map(([ax, ay]) => {
      const ins = cyl(.12, .12, 2.2, insulatorMat, 0, 0, 0, t, 8); ins.position.set(ax, ay-1.1, 0);
      return new THREE.Vector3(ax, ay-2.2, 0).applyEuler(t.rotation).add(t.position);
    });
    return tips;
  });
  for (let i=0;i<towers.length-1;i++){
    towers[i].forEach((a, k) => {
      const b = towers[i+1][k], span = a.distanceTo(b), sag = span*.035;
      const pts = []; for (let s=0;s<=24;s++){ const u=s/24; pts.push(new THREE.Vector3().lerpVectors(a, b, u).add(new THREE.Vector3(0, -sag*4*u*(1-u), 0))); }
      const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 24, .045, 4), cableMat);
      m.castShadow = true; scene.add(m);
    });
  }
}

async function sky(){

  hdr.mapping = THREE.EquirectangularReflectionMapping;
  // find the sun: brightest pixel of the HDR
  const { data, width, height } = hdr.image;
  let best = 0, bx = 0, by = 0;
  for (let y=0;y<height/2;y++) for (let x=0;x<width;x++){
    const i = (y*width + x)*4, l = data[i]*.2126 + data[i+1]*.7152 + data[i+2]*.0722;

  sunDir.set(Math.cos(el)*Math.cos(az), Math.sin(el), Math.cos(el)*Math.sin(az)).normalize();
  const i = (by*width + bx)*4, mx = Math.max(data[i], data[i+1], data[i+2]);
  sun.color.setRGB(data[i]/mx, data[i+1]/mx*.97, data[i+2]/mx*.92);

}

  document.getElementById("count").textContent = `${shot+1} / ${SHOTS.length}`;
  document.getElementById("prev").disabled = shot === 0;
  document.getElementById("next").disabled = shot === SHOTS.length-1;
}

function updateCamera(t){
  if (!to) return;
  const k = dur ? Math.min(1, (t - tStart)/dur) : 1, e = ease(k);
  const lift = from.pos.distanceTo(to.pos) * .18 * Math.sin(Math.PI*e);
  camPos.lerpVectors(from.pos, to.pos, e); camPos.y += lift;
  camLook.lerpVectors(from.look, to.look, e);
  // a slow, slight drift so still shots breathe
  const drift = reduced ? 0 : 1;
  camera.position.copy(camPos).add(V(Math.sin(t*.13)*.25, Math.sin(t*.17)*.12, Math.cos(t*.11)*.25).multiplyScalar(drift * (1 + camPos.y*.01)));
  const look = camLook.clone();
  // drag to look around
  const off = new THREE.Vector3().subVectors(look, camera.position);
  off.applyAxisAngle(V(0,1,0), view.yaw);
  const right = new THREE.Vector3().crossVectors(off, V(0,1,0)).normalize();
  off.applyAxisAngle(right, view.pitch);
  camera.lookAt(camera.position.clone().add(off));
}

/* drag to look, springs back */
const view = { yaw:0, pitch:0, ty:0, tp:0, dragging:false, x:0, y:0 };
const cv = renderer.domElement;
cv.addEventListener("pointerdown", e => { view.dragging = true; view.x = e.clientX; view.y = e.clientY; cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", e => {
  if (!view.dragging) return;
  view.ty = Math.max(-.5, Math.min(.5, view.ty + (e.clientX - view.x) * .003));
  view.tp = Math.max(-.2, Math.min(.2, view.tp - (e.clientY - view.y) * .002));
  view.x = e.clientX; view.y = e.clientY;
});
const release = () => { view.dragging = false; };
cv.addEventListener("pointerup", release); cv.addEventListener("pointercancel", release);

/* ═════════════════════ CAPTIONS & CONTROLS ═════════════════════ */
const capEl = document.getElementById("caption");
const esc = s => s.replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c]));
let capTimer = 0;
function showCaption(){
  const s = SCENES[shot];
  capEl.classList.add("out");
  clearTimeout(capTimer);
  capTimer = setTimeout(() => {
    const H = s.h1 ? "h1" : "h2";
    capEl.innerHTML = `<div class="kick">${esc(s.kick)}</div><${H}>${esc(s.title)}</${H}><p>${esc(s.text)}</p>` +
      (s.figs ? `<div class="figs">${s.figs.map(([b, t]) => `<div><b>${esc(b)}</b><span>${esc(t)}</span></div>`).join("")}</div>` : "") +
      (s.contact ? `<div class="links"><a href="mailto:preethunath@gmail.com">preethunath@gmail.com</a><a href="https://linkedin.com/in/preethu-nath-manjunath">LinkedIn</a><a href="https://github.com/preethu-manjunath">GitHub</a><a href="resume.html">Résumé</a></div>` : "");
    capEl.classList.remove("out");
  }, reduced ? 0 : Math.min(1400, dur*450));
}
document.getElementById("next").addEventListener("click", () => go(shot+1));
document.getElementById("prev").addEventListener("click", () => go(shot-1));
addEventListener("keydown", e => {
  if (["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ e.preventDefault(); go(shot+1); }
  if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ e.preventDefault(); go(shot-1); }
});
let wheelLock = 0;
addEventListener("wheel", e => {
  if (Math.abs(e.deltaY) < 12 || performance.now() < wheelLock) return;
  wheelLock = performance.now() + 1400; go(shot + Math.sign(e.deltaY));
}, { passive:true });
let touchY = null;
addEventListener("touchstart", e => { touchY = e.touches[0].clientY; }, { passive:true });
addEventListener("touchend", e => {
  if (touchY === null) return; const dy = touchY - e.changedTouches[0].clientY; touchY = null;
  if (Math.abs(dy) > 60) go(shot + Math.sign(dy));
}, { passive:true });

addEventListener("resize", () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* ═════════════════════ LOOP ═════════════════════ */
const clock = new THREE.Clock();
let graphAmt = 0;
function frame(){
  const t = clock.getElapsedTime();
  windTime.value = reduced ? 0 : t;
  animators.forEach(a => a(t));
  view.yaw += ((view.dragging ? view.ty : (view.ty *= .94)) - view.yaw) * .1;
  view.pitch += ((view.dragging ? view.tp : (view.tp *= .94)) - view.pitch) * .1;
  updateCamera(t);
  graphAmt += (graphTarget - graphAmt) * .03;
  graphMat.opacity = graphAmt * .75; nodeMat.opacity = graphAmt;
  graph.visible = graphAmt > .01;
  composer.render();
}

/* ═════════════════════ START ═════════════════════ */
(async () => {
  try {
    await Promise.all([sky(), props()]);
  } catch (e) {
    console.error(e);
    loadTxt.textContent = "Some scenery couldn't load. Showing what we have.";
  }
  camPos.copy(V(120, 70, 240)); camLook.copy(V(0, 5, 0));
  go(0);
  dur = reduced ? 0 : 5; // a slow first approach
  renderer.setAnimationLoop(frame);
  setTimeout(() => document.getElementById("loader").classList.add("done"), 300);
})();
</script>
