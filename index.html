<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#14120f;color:#f4f1ea;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:2px}

.bg{position:fixed;inset:0;overflow:hidden}
.bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 2.2s ease}
.bg video.on{opacity:1}
.bg::after{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 55%,rgba(0,0,0,0)),
             linear-gradient(0deg,rgba(0,0,0,.45),rgba(0,0,0,0) 45%)}

main{position:fixed;left:clamp(20px,5vw,72px);bottom:clamp(28px,8vh,88px);max-width:min(620px,calc(100vw - 40px));z-index:2}
h1{font-family:"Source Serif 4",Georgia,serif;font-weight:400;font-size:clamp(40px,6vw,76px);line-height:1;letter-spacing:-.02em;margin:0 0 16px}
p{margin:0;font-size:clamp(17px,1.6vw,20px);line-height:1.45;color:rgba(244,241,234,.85)}
nav{display:flex;flex-wrap:wrap;gap:10px 24px;margin-top:26px;font-size:15px}
nav a{text-decoration:none;border-bottom:1px solid rgba(255,255,255,.45);padding-bottom:2px;transition:border-color .2s}
nav a:hover{border-color:#fff}

.avatar{position:fixed;right:clamp(12px,6vw,96px);bottom:0;z-index:1;height:min(52vh,470px);width:auto;
  filter:drop-shadow(0 20px 34px rgba(0,0,0,.4));opacity:0;transform:translateY(30px);
  transition:opacity 1s ease .6s,transform 1s cubic-bezier(.22,1,.36,1) .6s}
.ready .avatar{opacity:1;transform:none}
@media (max-width:700px){
  .avatar{top:max(24px,env(safe-area-inset-top));bottom:auto;right:0;height:min(32vh,250px);
    -webkit-mask-image:linear-gradient(#000 60%,transparent 92%);mask-image:linear-gradient(#000 60%,transparent 92%)}
  .bg::after{background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,.1) 60%,rgba(0,0,0,.15))}
}
</style>

<body>

  </nav>
</main>

<script>
(function(){
  // Real footage (Mixkit, free licence): oil field → power lines → data center → wind farm.
  var CLIPS = [48353, 28351, 20822, 51777].map(function(id){ return "https://assets.mixkit.co/videos/" + id + "/" + id + "-720.mp4"; });
  var HOLD = 8000;
  var reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  var c = navigator.connection, lite = reduced || (c && (c.saveData || /2g/.test(c.effectiveType || "")));
  var bg = document.getElementById("bg");

  var vids = (lite ? CLIPS.slice(0, 1) : CLIPS).map(function(src, i){
    var v = document.createElement("video");
    v.muted = true; v.playsInline = true; v.loop = true;
    v.setAttribute("muted", ""); v.setAttribute("playsinline", "");
    v.preload = i === 0 ? "auto" : "none";
    v.src = src; bg.appendChild(v); return v;
  });

  var cur = 0;
  function show(i){
    var v = vids[i];
    var next = vids[(i + 1) % vids.length];
    if (next !== v) next.preload = "auto";          // warm up the next clip while this one plays
    var p = reduced ? Promise.resolve() : v.play();
    (p && p.catch ? p : Promise.resolve()).catch(function(){}).then(function(){
      vids.forEach(function(o){ o.classList.toggle("on", o === v); });
      setTimeout(function(){ vids.forEach(function(o){ if (o !== v) o.pause(); }); }, 2400);
    });
  }
  function start(){ show(0); document.body.classList.add("ready"); }
  vids[0].addEventListener("loadeddata", start, { once:true });
  setTimeout(function(){ document.body.classList.add("ready"); }, 1500);

  if (vids.length > 1) setInterval(function(){
    if (document.hidden) return;
    cur = (cur + 1) % vids.length; show(cur);
  }, HOLD);
})();
</script>
</body>
